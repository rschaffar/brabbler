name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    # Independent machines avoid core/Chromium contention.
    # Genuine Home Manager deployment remains a local Linux/KVM acceptance check.
    name: acceptance (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [core, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 4
      - name: Evaluate the complete native check graph
        run: nix flake check --no-build --no-write-lock-file
      # Execute the same core and sandboxed browser/terminal definitions freshly.
      # User-owned diagnostics remain uploadable on failure;
      # never widen permissions on nixbld's failed trees or retry a failed suite.
      - name: Fresh core and bundled-plugin acceptance
        if: matrix.suite == 'core'
        id: core
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          nix run --no-write-lock-file .#test -- core 2>&1 | tee test-results/core.log
          statuses=("${PIPESTATUS[@]}")
          status=${statuses[0]}
          if [ "$status" -eq 0 ]; then status=${statuses[1]}; fi
          root=$(awk '/^Private core test root / { print $NF }' test-results/core.log | tail -1)
          if [[ ! "$root" =~ ^/tmp/brabbler-test-core\.[A-Za-z0-9]+$ ]]; then root="$GITHUB_WORKSPACE/test-results/not-started-core"; status=1; fi
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Fresh complete sandboxed browser and terminal acceptance
        if: matrix.suite == 'e2e'
        id: e2e
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          nix run --no-write-lock-file .#test -- e2e 2>&1 | tee test-results/e2e.log
          statuses=("${PIPESTATUS[@]}")
          status=${statuses[0]}
          if [ "$status" -eq 0 ]; then status=${statuses[1]}; fi
          root=$(awk '/^Artifacts: \/tmp\/brabbler-test-browser\./ { print $2 }' test-results/e2e.log | tail -1)
          if [[ ! "$root" =~ ^/tmp/brabbler-test-browser\.[A-Za-z0-9]+$ ]]; then root="$GITHUB_WORKSPACE/test-results/not-started-e2e"; status=1; fi
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-acceptance-${{ matrix.suite }}
          path: |
            test-results/core.log
            test-results/e2e.log
            ${{ steps.core.outputs.root || 'test-results/not-started-core' }}/artifacts
            ${{ steps.core.outputs.root || 'test-results/not-started-core' }}/lifecycle.json
            ${{ steps.core.outputs.root || 'test-results/not-started-core' }}/run.json
            ${{ steps.core.outputs.root || 'test-results/not-started-core' }}/driver.log
            ${{ steps.e2e.outputs.root || 'test-results/not-started-e2e' }}/groups
            ${{ steps.e2e.outputs.root || 'test-results/not-started-e2e' }}/run.json
            ${{ steps.e2e.outputs.root || 'test-results/not-started-e2e' }}/preparation.log
          retention-days: 7
          if-no-files-found: warn
