name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # Separate expensive bundled-plugin integration selection; core stays independent.
      - run: node --experimental-strip-types --test "plugins/**/*.test.mjs"

  e2e:
    strategy:
      matrix:
        selection: [core, git-workflow-plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_SERVER_MODE: dev
          E2E_GIT_WORKFLOW_PLUGIN_ONLY: ${{ matrix.selection == 'git-workflow-plugin' && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-${{ matrix.selection }}
          path: test-results/e2e/
          retention-days: 7
