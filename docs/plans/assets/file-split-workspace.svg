<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">Pi Web file split workspace — proposed review experience</title>
  <desc id="desc">A full-height review guide on the left sends source links to the upper-right code pane. A third lower-right pane keeps tests visible. Controls explicitly create splits right or below; subsequent links reuse the chosen destination. A smaller example shows four files in a two-by-two layout. This is a static design, not an implemented interface.</desc>
  <defs>
    <style>
      text { font-family: system-ui, sans-serif; fill: #e3e7ef; }
      .muted { fill: #9aa6ba; }
      .small { font-size: 13px; }
      .body { font-size: 16px; }
      .mono { font-family: ui-monospace, monospace; font-size: 14px; }
      .link { fill: #a3c8ff; }
      .label { font-size: 12px; font-weight: 650; letter-spacing: 1.5px; }
      .line { stroke: #344052; }
    </style>
    <clipPath id="workspace"><rect x="48" y="155" width="1344" height="598" rx="12"/></clipPath>
  </defs>
  <rect width="1440" height="1080" fill="#10151f"/>
  <text x="48" y="48" class="label muted">PI WEB / UX PROPOSAL</text>
  <text x="48" y="90" font-size="32" font-weight="650">Keep the guide. Follow the code.</text>
  <text x="48" y="124" font-size="17" class="muted">Choose a destination once for this document. More links reuse it. More panes are always your choice.</text>
  <g clip-path="url(#workspace)">
    <rect x="48" y="155" width="1344" height="598" fill="#171e2a"/>
    <rect x="48" y="155" width="1344" height="48" fill="#202938"/>
    <text x="68" y="185" font-size="16" font-weight="600">Files workspace</text>
    <text x="250" y="185" class="small muted">Expanded · chat stays available on restore</text>
    <text x="1220" y="185" class="small">Restore Files ↙</text>
    <line x1="48" x2="1392" y1="203" y2="203" class="line"/>
    <!-- Full-height guide -->
    <rect x="48" y="203" width="592" height="42" fill="#1e2837"/>
    <rect x="62" y="213" width="22" height="22" rx="5" fill="#364257"/>
    <text x="69" y="229" class="small">1</text>
    <text x="98" y="230" class="small" font-weight="600">Walkthrough.md</text>
    <text x="550" y="230" class="small muted">Split ▾</text>
    <rect x="48" y="245" width="592" height="45" fill="#192332"/>
    <text x="68" y="274" class="small muted">Rendered ▾</text>
    <rect x="365" y="253" width="251" height="29" rx="6" fill="#263b58" stroke="#6b9de0"/>
    <text x="379" y="273" class="small link">Links → Pane 2 · Parser.cs ▾</text>
    <text x="83" y="337" font-size="25" font-weight="650">Understand the decoding path</text>
    <text x="83" y="376" class="body muted">Start with the overall flow, then follow the</text>
    <text x="83" y="402" class="body muted">important decisions in the implementation.</text>
    <text x="83" y="452" font-size="19" font-weight="600">1. Read and validate the input</text>
    <text x="83" y="488" class="body muted">Open the parser. Notice where parsing ends</text>
    <text x="83" y="514" class="body muted">and validation begins.</text>
    <rect x="76" y="531" width="216" height="36" rx="6" fill="#233753"/>
    <text x="88" y="555" class="body link">Parser.cs → Pane 2</text>
    <text x="83" y="607" font-size="19" font-weight="600">2. Check the evidence</text>
    <text x="83" y="642" class="body muted">Keep the tests below the implementation</text>
    <text x="83" y="668" class="body muted">when you want to compare both.</text>
    <text x="83" y="717" class="small muted">Guide scroll and keyboard focus remain here.</text>
    <!-- Dividers -->
    <rect x="640" y="203" width="6" height="550" fill="#3d4e67"/>
    <rect x="641" y="450" width="4" height="38" rx="2" fill="#7a8ca8"/>
    <!-- Following code pane -->
    <rect x="646" y="203" width="746" height="42" fill="#23324a"/>
    <rect x="660" y="213" width="22" height="22" rx="5" fill="#4a70a3"/>
    <text x="667" y="229" class="small">2</text>
    <text x="696" y="230" class="small" font-style="italic">Parser.cs</text>
    <text x="785" y="230" class="small muted">Preview</text>
    <text x="1148" y="230" class="small muted">Keep open</text>
    <text x="1302" y="230" class="small">Split ▾</text>
    <rect x="646" y="245" width="746" height="45" fill="#192332"/>
    <text x="667" y="274" class="small muted">←  →    Source</text>
    <text x="1077" y="274" class="small link">Receiving links from Pane 1</text>
    <text x="677" y="328" class="mono muted">01</text>
    <text x="725" y="328" class="mono">function readCandidate(input) {</text>
    <rect x="713" y="346" width="633" height="80" rx="4" fill="#273a55"/>
    <text x="677" y="371" class="mono muted">02</text>
    <text x="725" y="371" class="mono link">  const decoded = read(input);</text>
    <text x="677" y="402" class="mono muted">03</text>
    <text x="725" y="402" class="mono link">  return validate(decoded);</text>
    <text x="677" y="450" class="mono muted">04</text>
    <text x="725" y="450" class="mono">}</text>
    <text x="725" y="486" class="small muted">Illustrative content · next guide link reuses this preview</text>
    <rect x="646" y="510" width="746" height="6" fill="#3d4e67"/>
    <rect x="1000" y="511" width="38" height="4" rx="2" fill="#7a8ca8"/>
    <!-- Kept tests pane -->
    <rect x="646" y="516" width="746" height="42" fill="#1e2837"/>
    <rect x="660" y="526" width="22" height="22" rx="5" fill="#364257"/>
    <text x="667" y="542" class="small">3</text>
    <text x="696" y="543" class="small">ParserTests.cs</text>
    <text x="1302" y="543" class="small muted">Split ▾</text>
    <text x="677" y="598" class="mono muted">01</text>
    <text x="725" y="598" class="mono">test("rejects invalid input", () => {</text>
    <text x="677" y="630" class="mono muted">02</text>
    <text x="725" y="630" class="mono">  expectInvalidCandidate();</text>
    <text x="677" y="662" class="mono muted">03</text>
    <text x="725" y="662" class="mono">});</text>
    <text x="725" y="717" class="small muted">Kept visible · not the guide's link destination</text>
  </g>
  <rect x="48" y="155" width="1344" height="598" rx="12" fill="none" stroke="#3c495e"/>
  <!-- Supporting design rules and fourth-pane example -->
  <text x="48" y="805" class="label muted">EXPLICIT SPLITS, PREDICTABLE LINKS</text>
  <text x="48" y="842" font-size="19" font-weight="600">Split right / Split below</text>
  <text x="48" y="870" class="body muted">Repeat on any pane for three, four or more files.</text>
  <text x="48" y="914" font-size="19" font-weight="600">Keep open ≠ keep visible</text>
  <text x="48" y="942" class="body muted">Keep retains a tab. Split keeps a file on screen.</text>
  <text x="48" y="986" font-size="19" font-weight="600">One-shot link menu</text>
  <text x="48" y="1014" class="body muted">Open here / Open in pane… never changes the guide's route.</text>
  <rect x="914" y="790" width="478" height="236" rx="10" fill="#171e2a" stroke="#3c495e"/>
  <text x="935" y="822" class="small muted">ALSO POSSIBLE: FOUR FILES, 2 × 2</text>
  <rect x="934" y="841" width="217" height="72" rx="4" fill="#243248"/>
  <text x="951" y="882" class="small">1 · Guide</text>
  <rect x="1157" y="841" width="215" height="72" rx="4" fill="#243b5a"/>
  <text x="1174" y="882" class="small link">2 · Following code</text>
  <rect x="934" y="919" width="217" height="72" rx="4" fill="#243248"/>
  <text x="951" y="960" class="small">3 · Tests</text>
  <rect x="1157" y="919" width="215" height="72" rx="4" fill="#243248"/>
  <text x="1174" y="960" class="small">4 · Related file</text>
  <text x="48" y="1056" class="small muted">Static concept, not a screenshot or working prototype. No automatic splitting. No new global link mode.</text>
</svg>
