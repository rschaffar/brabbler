<text x="24" y="940" class="small muted">Schematic source excerpts; exact pinned cards are in the sample notebook. Controls are static.</text>
<text x="24" y="968" class="small muted">Guide/Evidence returns preserve reading place. Step Back/Next remains a separate, unrestricted navigation action.</text>
<text x="24" y="996" class="small muted">Increment 2 adds recording and forms; these reader-only views intentionally have no fake active review controls.</text>
</svg>
