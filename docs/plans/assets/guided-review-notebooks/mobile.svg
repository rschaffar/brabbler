<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1030" viewBox="0 0 1320 1030" role="img" aria-labelledby="title desc">
<title id="title">Guided reader on mobile — three views of one step</title>
<desc id="desc">Guide, Evidence and stacked Compare views retain the same question and step position. Evidence selection and Back to guide are separate from sticky step Back and Next. Reader-only increment, no recording controls. Static design storyboard.</desc>
<defs><style>
text{font-family:DejaVu Sans,sans-serif;fill:#e4e9f2;font-size:15px}.muted{fill:#a9b4c8}.small{font-size:12px}.tiny{font-size:11px}.label{font-size:13px;font-weight:bold}.heading{font-size:19px;font-weight:bold}.accent{fill:#9dbeff}.code{font-family:DejaVu Sans Mono,monospace;font-size:11px}.button{fill:#273650;stroke:#516886}.rule{stroke:#354257;stroke-width:1}
</style></defs>
<rect width="1320" height="1030" fill="#101722"/>
<text x="24" y="36" class="label accent">DESIGN DRAFT · INCREMENT 1 · MOBILE READER STORYBOARD</text>
<text x="24" y="66" class="small muted">Three views of step 1.2 — switching Guide / Evidence / Compare never advances the tour.</text>
<text x="24" y="106" class="label">1 · READ THE GUIDE</text>
<text x="465" y="106" class="label">2 · INSPECT EVIDENCE</text>
<text x="906" y="106" class="label">3 · COMPARE, STACKED</text>
<g transform="translate(24 126)">
<rect width="390" height="772" rx="17" fill="#1b2637" stroke="#516886"/>
<text x="20" y="34" class="small accent">☰ Chapters · 1. Evidence identity</text>
<text x="20" y="76" class="heading">Can an obsolete read still</text><text x="20" y="102" class="heading">change the display?</text>
<text x="20" y="126" class="small muted">Step 1.2 · 2 of 4 · pinned evidence</text>
<rect x="16" y="144" width="174" height="38" rx="6" fill="#293f62"/><text x="78" y="169" class="small accent">Guide</text>
<rect x="200" y="144" width="174" height="38" rx="6" class="button"/><text x="241" y="169" class="small">Evidence (2)</text>
<text x="20" y="220" class="label accent">LOOK AT</text>
<text x="20" y="250">Abort cleanup and signal guards.</text>
<text x="20" y="276">Compare implementation and test.</text>
<text x="20" y="326" class="label accent">CHECK FOR</text>
<text x="20" y="356">Which updates can settle late?</text>
<text x="20" y="382">What does the supplied test prove?</text>
<text x="20" y="432" class="label accent">WHY IT MATTERS</text>
<text x="20" y="462">Immutable bytes can still belong</text>
<text x="20" y="488">to the wrong selected step.</text>
<rect x="20" y="526" width="350" height="44" rx="6" class="button"/><text x="43" y="554" class="small">Show more context</text>
<text x="20" y="618" class="small muted">No review completion is inferred.</text>
<text x="20" y="644" class="small muted">Scroll content above the step toolbar.</text>
<line x1="0" y1="690" x2="390" y2="690" class="rule"/>
<rect x="16" y="706" width="116" height="44" rx="7" class="button"/><text x="39" y="734">← Back</text>
<text x="159" y="734" class="small muted">1.2</text>
<rect x="250" y="706" width="124" height="44" rx="7" fill="#365d9c"/><text x="277" y="734">Next →</text>
</g>
